<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090f">
  <title>UshaLiveAI — Mentor Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070c;
      --panel: #0b0f17;
      --panel2: #101621;
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8e98aa;
      --blue: #5b8cff;
      --green: #20d68b;
      --red: #ff465c;
      --yellow: #f7c948;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(65,95,180,.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(45,120,100,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 66px;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,.92);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#5b8cff,#8c5cff);
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 8px 25px rgba(91,140,255,.22);
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      letter-spacing: -.2px;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 11px;
    }

    .top-center {
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .class-name {
      font-size: 13px;
      color: #dfe5f1;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,70,92,.11);
      border: 1px solid rgba(255,70,92,.25);
      color: #ff6a7b;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px rgba(255,70,92,.9);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(255,255,255,.045);
      color: #dbe2ee;
      border: 1px solid var(--border);
      transition: .2s;
    }

    .top-btn:hover {
      background: rgba(255,255,255,.09);
      transform: translateY(-1px);
    }

    /* =========================
       MAIN
    ========================= */

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) 285px;
    }

    .stage-wrap {
      min-width: 0;
      min-height: 0;
      position: relative;
      padding: 14px;
      display: flex;
    }

    .stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      background:
        radial-gradient(circle at center, rgba(55,70,100,.13), transparent 45%),
        #090d14;
      box-shadow: var(--shadow);
    }

    .stage-grid {
      position: absolute;
      inset: 0;
      opacity: .25;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .stage-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .placeholder-content {
      max-width: 390px;
      padding: 30px;
    }

    .placeholder-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 17px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      font-size: 34px;
    }

    .placeholder-content h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .placeholder-content p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    #mainVideo,
    #mainImage,
    #screenVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
      z-index: 2;
    }

    #mainImage {
      object-fit: contain;
    }

    #screenVideo {
      object-fit: contain;
    }

    .stage-label {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 7px 11px;
      border-radius: 9px;
      background: rgba(0,0,0,.5);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      color: #dfe6f1;
      font-size: 10px;
      font-weight: 700;
    }

    .record-status {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 12;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,50,70,.12);
      border: 1px solid rgba(255,50,70,.28);
      color: #ff7281;
      font-size: 11px;
      font-weight: 800;
    }

    .record-status.active {
      display: flex;
    }

    .record-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
        transform: scale(.72);
      }
    }

    /* =========================
       MENTOR CAMERA
    ========================= */

    .mentor-pip {
      position: absolute;
      width: 205px;
      height: 125px;
      right: 22px;
      bottom: 22px;
      z-index: 8;
      border-radius: 15px;
      overflow: hidden;
      background: #111720;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 18px 45px rgba(0,0,0,.5);
      display: none;
      cursor: move;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .pip-label {
      position: absolute;
      bottom: 7px;
      left: 8px;
      padding: 4px 7px;
      border-radius: 6px;
      background: rgba(0,0,0,.55);
      font-size: 9px;
      color: #fff;
    }

    /* =========================
       STUDENTS
    ========================= */

    .students-panel {
      border-left: 1px solid var(--border);
      background: rgba(10,14,22,.95);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .students-head {
      padding: 17px;
      border-bottom: 1px solid var(--border);
    }

    .students-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .students-title strong {
      font-size: 13px;
    }

    .student-count {
      min-width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(91,140,255,.12);
      color: #8facff;
      font-size: 10px;
      font-weight: 800;
    }

    .students-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 9px;
    }

    .student {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 11px;
      margin-bottom: 4px;
      transition: .2s;
    }

    .student:hover {
      background: rgba(255,255,255,.035);
    }

    .avatar {
      width: 35px;
      height: 35px;
      flex: 0 0 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#29344b,#172033);
      border: 1px solid rgba(255,255,255,.09);
      font-size: 14px;
    }

    .student-info {
      min-width: 0;
    }

    .student-info strong {
      display: block;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-info span {
      color: var(--muted);
      font-size: 9px;
    }

    .online-dot {
      margin-left: auto;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 9px rgba(32,214,139,.7);
    }

    .empty-students {
      padding: 35px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    /* =========================
       CONTROL BAR
    ========================= */

    .controls {
      min-height: 104px;
      padding: 12px 16px 15px;
      border-top: 1px solid var(--border);
      background: rgba(7,9,15,.97);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 30;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-btn {
      min-width: 73px;
      height: 58px;
      padding: 7px 10px;
      border-radius: 12px;
      color: #dfe5ef;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: .18s;
    }

    .control-btn:hover {
      background: rgba(255,255,255,.085);
      transform: translateY(-1px);
    }

    .control-btn.active {
      border-color: rgba(91,140,255,.55);
      background: rgba(91,140,255,.12);
      color: #9eb5ff;
    }

    .control-btn.danger {
      color: #ff7382;
      border-color: rgba(255,70,92,.25);
      background: rgba(255,70,92,.07);
    }

    .control-btn.primary {
      color: #fff;
      border-color: rgba(91,140,255,.45);
      background: linear-gradient(135deg,rgba(91,140,255,.23),rgba(118,84,255,.17));
    }

    .control-icon {
      font-size: 18px;
      line-height: 1;
    }

    .control-text {
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .record-btn.recording {
      background: rgba(255,70,92,.14);
      border-color: rgba(255,70,92,.55);
      color: #ff7382;
    }

    .timer {
      min-width: 73px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aeb8ca;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       MODALS
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(700px,100%);
      max-height: 90vh;
      overflow: auto;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #0d121b;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }

    .modal-head h3 {
      font-size: 16px;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      border-radius: 9px;
      color: #d8dfeb;
      background: rgba(255,255,255,.06);
    }

    .preview-video {
      width: 100%;
      max-height: 55vh;
      background: #000;
      border-radius: 13px;
      display: block;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 15px;
      border-radius: 9px;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      color: #e9edf5;
      font-size: 11px;
      font-weight: 700;
    }

    .action-btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-panel {
      position: fixed;
      top: 0;
      right: -360px;
      width: min(360px,92vw);
      height: 100vh;
      z-index: 80;
      background: #0b1018;
      border-left: 1px solid var(--border);
      box-shadow: -20px 0 60px rgba(0,0,0,.35);
      padding: 22px;
      transition: right .25s ease;
      overflow-y: auto;
    }

    .settings-panel.show {
      right: 0;
    }

    .settings-panel h3 {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .setting {
      margin-bottom: 18px;
    }

    .setting label {
      display: block;
      color: #c8d0dd;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .setting input {
      width: 100%;
      height: 42px;
      border-radius: 9px;
      border: 1px solid var(--border);
      outline: none;
      background: rgba(255,255,255,.045);
      color: #fff;
      padding: 0 11px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 130px;
      transform: translate(-50%,20px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      padding: 10px 15px;
      border-radius: 10px;
      background: rgba(15,20,29,.95);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: #eef2f8;
      font-size: 11px;
      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        min-height: 500px;
      }

      .students-panel {
        position: fixed;
        top: 66px;
        right: -310px;
        bottom: 104px;
        width: 300px;
        z-index: 70;
        transition: right .25s ease;
        box-shadow: -20px 0 50px rgba(0,0,0,.5);
      }

      .students-panel.show {
        right: 0;
      }

      .stage-wrap {
        min-height: 480px;
      }

      .top-center {
        display: none;
      }

      .mentor-pip {
        width: 145px;
        height: 92px;
        right: 14px;
        bottom: 14px;
      }

      .control-btn {
        min-width: 62px;
        height: 52px;
      }

      .controls {
        min-height: 104px;
      }
    }

    @media (max-width: 540px) {
      .brand-text {
        display: none;
      }

      .topbar {
        padding: 0 10px;
      }

      .stage-wrap {
        padding: 8px;
      }

      .stage {
        border-radius: 13px;
      }

      .control-row {
        gap: 5px;
      }

      .control-btn {
        min-width: 55px;
        height: 50px;
        padding: 5px 6px;
      }

      .control-icon {
        font-size: 16px;
      }

      .control-text {
        font-size: 8px;
      }

      .timer {
        min-width: 55px;
        height: 50px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-logo">U</div>

      <div class="brand-text">
        <strong>UshaLiveAI</strong>
        <span>Mentor Studio</span>
      </div>
    </div>

    <div class="top-center">
      <div class="class-name" id="className">My Live Class</div>

      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE STUDIO
      </div>
    </div>

    <div class="top-actions">
      <button class="top-btn" id="studentsToggle" title="Students">👥</button>
      <button class="top-btn" id="settingsBtn" title="Settings">⚙️</button>
      <button class="top-btn" id="logoutBtn" title="Logout">↪</button>
    </div>

  </header>


  <!-- WORKSPACE -->
  <main class="workspace">

    <!-- STAGE -->
    <section class="stage-wrap">

      <div class="stage" id="stage">

        <div class="stage-grid"></div>

        <div class="stage-label" id="stageLabel">
          Main Stage
        </div>

        <div class="record-status" id="recordStatus">
          <span class="record-pulse"></span>
          <span>RECORDING</span>
          <span id="recordTimer">00:00</span>
        </div>


        <!-- EMPTY STAGE -->
        <div class="stage-placeholder" id="stagePlaceholder">

          <div class="placeholder-content">

            <div class="placeholder-icon">🎬</div>

            <h2>Your Class Stage</h2>

            <p>
              Choose Main Video, Slide, Camera or Share Screen
              to start your live class.
            </p>

          </div>

        </div>


        <!-- MAIN VIDEO -->
        <video
          id="mainVideo"
          playsinline
          controls>
        </video>


        <!-- SLIDE -->
        <img
          id="mainImage"
          alt="Selected slide">


        <!-- SCREEN SHARE -->
        <video
          id="screenVideo"
          autoplay
          muted
          playsinline>
        </video>


        <!-- CAMERA -->
        <div class="mentor-pip" id="mentorPip">

          <video
            id="cameraVideo"
            autoplay
            muted
            playsinline>
          </video>

          <div class="pip-label">
            Mentor Camera
          </div>

        </div>

      </div>

    </section>


    <!-- STUDENTS -->
    <aside class="students-panel" id="studentsPanel">

      <div class="students-head">

        <div class="students-title">
          <strong>Students</strong>
          <span class="student-count" id="studentCount">0</span>
        </div>

      </div>

      <div class="students-list" id="studentsList">

        <div class="empty-students">
          No students connected yet.
        </div>

      </div>

    </aside>

  </main>


  <!-- CONTROL BAR -->
  <footer class="controls">

    <div class="control-row">

      <button class="control-btn" id="slideBtn">
        <span class="control-icon">🖼️</span>
        <span class="control-text">Slide</span>
      </button>

      <button class="control-btn" id="mainVideoBtn">
        <span class="control-icon">🎬</span>
        <span class="control-text">Main Video</span>
      </button>

      <button class="control-btn" id="cameraBtn">
        <span class="control-icon">📷</span>
        <span class="control-text">Camera</span>
      </button>

      <button class="control-btn" id="micBtn">
        <span class="control-icon">🎙️</span>
        <span class="control-text">Mic</span>
      </button>

      <button class="control-btn" id="shareBtn">
        <span class="control-icon">🖥️</span>
        <span class="control-text">Share Screen</span>
      </button>

      <button class="control-btn" id="playBtn">
        <span class="control-icon">▶️</span>
        <span class="control-text">Play</span>
      </button>

      <button class="control-btn" id="clearBtn">
        <span class="control-icon">🧹</span>
        <span class="control-text">Clear</span>
      </button>

      <button class="control-btn primary record-btn" id="recordBtn">
        <span class="control-icon">🔴</span>
        <span class="control-text">Record</span>
      </button>

      <button class="control-btn" id="pauseBtn">
        <span class="control-icon">⏸️</span>
        <span class="control-text">Pause</span>
      </button>

      <div class="timer" id="sessionTimer">
        00:00
      </div>

      <button class="control-btn" id="fullscreenBtn">
        <span class="control-icon">⛶</span>
        <span class="control-text">Fullscreen</span>
      </button>

      <button class="control-btn danger" id="endBtn">
        <span class="control-icon">⏹</span>
        <span class="control-text">End Studio</span>
      </button>

    </div>

  </footer>

</div>


<!-- FILE INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  hidden>

<input
  type="file"
  id="slideInput"
  accept="image/*"
  hidden>


<!-- SETTINGS -->

<aside class="settings-panel" id="settingsPanel">

  <div class="modal-head">

    <h3>Studio Settings</h3>

    <button class="close-btn" id="closeSettings">
      ✕
    </button>

  </div>


  <div class="setting">

    <label>Class Name</label>

    <input
      id="classNameInput"
      type="text"
      placeholder="Enter class name">

  </div>


  <div class="setting">

    <label>Voice Clone API URL</label>

    <input
      id="voiceApiInput"
      type="url"
      placeholder="https://example.com">

  </div>


  <div class="modal-actions">

    <button
      class="action-btn primary"
      id="saveSettings">
      Save Settings
    </button>

  </div>

</aside>


<!-- PREVIEW MODAL -->

<div class="modal-backdrop" id="previewModal">

  <div class="modal">

    <div class="modal-head">

      <h3>Recording Preview</h3>

      <button class="close-btn" id="closePreview">
        ✕
      </button>

    </div>

    <video
      class="preview-video"
      id="previewVideo"
      controls
      playsinline>
    </video>

    <div class="modal-actions">

      <button
        class="action-btn"
        id="closePreview2">
        Close
      </button>

      <button
        class="action-btn primary"
        id="downloadRecording">
        Download Recording
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>
/* =========================================================
   USHALIVEAI — MENTOR STUDIO CORE
   NO MODULE DEPENDENCY
   CORE BUTTONS WORK EVEN IF FIREBASE FAILS
========================================================= */

(function () {

  "use strict";


  /* =======================================================
     ELEMENTS
  ======================================================= */

  const $ = (id) => document.getElementById(id);

  const stage = $("stage");
  const stagePlaceholder = $("stagePlaceholder");

  const mainVideo = $("mainVideo");
  const mainImage = $("mainImage");
  const screenVideo = $("screenVideo");

  const cameraVideo = $("cameraVideo");
  const mentorPip = $("mentorPip");

  const videoInput = $("videoInput");
  const slideInput = $("slideInput");

  const slideBtn = $("slideBtn");
  const mainVideoBtn = $("mainVideoBtn");
  const cameraBtn = $("cameraBtn");
  const micBtn = $("micBtn");
  const shareBtn = $("shareBtn");
  const playBtn = $("playBtn");
  const clearBtn = $("clearBtn");
  const recordBtn = $("recordBtn");
  const pauseBtn = $("pauseBtn");
  const fullscreenBtn = $("fullscreenBtn");
  const endBtn = $("endBtn");

  const studentsToggle = $("studentsToggle");
  const studentsPanel = $("studentsPanel");

  const settingsBtn = $("settingsBtn");
  const settingsPanel = $("settingsPanel");
  const closeSettings = $("closeSettings");
  const saveSettings = $("saveSettings");

  const logoutBtn = $("logoutBtn");

  const className = $("className");
  const classNameInput = $("classNameInput");

  const voiceApiInput = $("voiceApiInput");

  const toast = $("toast");

  const recordStatus = $("recordStatus");
  const recordTimer = $("recordTimer");
  const sessionTimer = $("sessionTimer");

  const previewModal = $("previewModal");
  const previewVideo = $("previewVideo");
  const closePreview = $("closePreview");
  const closePreview2 = $("closePreview2");
  const downloadRecording = $("downloadRecording");


  /* =======================================================
     STATE
  ======================================================= */

  let cameraStream = null;
  let micStream = null;
  let screenStream = null;

  let recorder = null;
  let recordedChunks = [];

  let recordedBlob = null;
  let recordedUrl = null;

  let videoObjectUrl = null;
  let slideObjectUrl = null;

  let recordingSeconds = 0;
  let recordingInterval = null;

  let sessionSeconds = 0;
  let sessionInterval = null;

  let isRecording = false;
  let isPaused = false;


  /* =======================================================
     TOAST
  ======================================================= */

  let toastTimer = null;

  function showToast(message) {

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }


  /* =======================================================
     TIME
  ======================================================= */

  function formatTime(seconds) {

    const mins = Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");

    const secs = Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

    return mins + ":" + secs;
  }


  /* =======================================================
     SESSION TIMER
  ======================================================= */

  function startSessionTimer() {

    if (sessionInterval) return;

    sessionInterval = setInterval(() => {

      sessionSeconds++;

      sessionTimer.textContent =
        formatTime(sessionSeconds);

    }, 1000);
  }


  startSessionTimer();


  /* =======================================================
     STAGE
  ======================================================= */

  function updateStage() {

    const videoVisible =
      mainVideo.style.display === "block";

    const imageVisible =
      mainImage.style.display === "block";

    const screenVisible =
      screenVideo.style.display === "block";

    const cameraVisible =
      mentorPip.style.display === "block";

    const hasContent =
      videoVisible ||
      imageVisible ||
      screenVisible ||
      cameraVisible;

    stagePlaceholder.style.display =
      hasContent ? "none" : "flex";
  }


  /* =======================================================
     MAIN VIDEO
  ======================================================= */

  mainVideoBtn.addEventListener("click", function () {

    if (isRecording) {

      showToast(
        "Stop recording before changing Main Video."
      );

      return;
    }

    videoInput.value = "";
    videoInput.click();

  });


  videoInput.addEventListener("change", function (event) {

    const file = event.target.files &&
                 event.target.files[0];

    if (!file) return;

    if (videoObjectUrl) {

      URL.revokeObjectURL(videoObjectUrl);

    }

    videoObjectUrl =
      URL.createObjectURL(file);

    mainVideo.src = videoObjectUrl;

    mainVideo.style.display = "block";

    mainImage.style.display = "none";
    screenVideo.style.display = "none";

    mainVideo.currentTime = 0;

    updateStage();

    showToast(
      "Main Video loaded: " + file.name
    );

  });


  /* =======================================================
     SLIDE
  ======================================================= */

  slideBtn.addEventListener("click", function () {

    if (isRecording) {

      showToast(
        "Stop recording before changing Slide."
      );

      return;
    }

    slideInput.value = "";
    slideInput.click();

  });


  slideInput.addEventListener("change", function (event) {

    const file = event.target.files &&
                 event.target.files[0];

    if (!file) return;

    if (slideObjectUrl) {

      URL.revokeObjectURL(slideObjectUrl);

    }

    slideObjectUrl =
      URL.createObjectURL(file);

    mainImage.src = slideObjectUrl;

    mainImage.style.display = "block";

    mainVideo.style.display = "none";
    screenVideo.style.display = "none";

    updateStage();

    showToast(
      "Slide loaded: " + file.name
    );

  });


  /* =======================================================
     PLAY
  ======================================================= */

  playBtn.addEventListener("click", async function () {

    if (mainVideo.style.display === "block") {

      try {

        if (mainVideo.paused) {

          await mainVideo.play();

          playBtn.classList.add("active");

          showToast("Main Video playing.");

        } else {

          mainVideo.pause();

          playBtn.classList.remove("active");

          showToast("Main Video paused.");

        }

      } catch (error) {

        showToast(
          "Video could not start. Click the video first."
        );

      }

      return;
    }

    if (screenVideo.style.display === "block") {

      try {

        await screenVideo.play();

      } catch (_) {}

      showToast("Screen preview playing.");

      return;
    }

    showToast("First select a Main Video or Share Screen.");

  });


  mainVideo.addEventListener("play", function () {

    playBtn.classList.add("active");

  });


  mainVideo.addEventListener("pause", function () {

    playBtn.classList.remove("active");

  });


  /* =======================================================
     CAMERA
  ======================================================= */

  cameraBtn.addEventListener("click", async function () {

    if (cameraStream) {

      stopCamera();

      return;
    }

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      cameraVideo.srcObject = cameraStream;

      mentorPip.style.display = "block";

      cameraBtn.classList.add("active");

      updateStage();

      showToast("Camera ON.");

    } catch (error) {

      console.error(error);

      showToast(
        "Camera permission was not granted."
      );

    }

  });


  function stopCamera() {

    if (cameraStream) {

      cameraStream.getTracks().forEach(track => {
        track.stop();
      });

      cameraStream = null;
    }

    cameraVideo.srcObject = null;

    mentorPip.style.display = "none";

    cameraBtn.classList.remove("active");

    updateStage();

    showToast("Camera OFF.");

  }


  /* =======================================================
     MICROPHONE
  ======================================================= */

  micBtn.addEventListener("click", async function () {

    if (micStream) {

      stopMic();

      return;
    }

    try {

      micStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

      micBtn.classList.add("active");

      showToast("Microphone ON.");

    } catch (error) {

      console.error(error);

      showToast(
        "Microphone permission was not granted."
      );

    }

  });


  function stopMic() {

    if (micStream) {

      micStream.getTracks().forEach(track => {
        track.stop();
      });

      micStream = null;
    }

    micBtn.classList.remove("active");

    showToast("Microphone OFF.");

  }


  /* =======================================================
     SCREEN SHARE
  ======================================================= */

  shareBtn.addEventListener("click", async function () {

    if (screenStream) {

      stopScreenShare();

      return;
    }

    try {

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

      screenVideo.srcObject =
        screenStream;

      screenVideo.style.display =
        "block";

      mainVideo.style.display =
        "none";

      mainImage.style.display =
        "none";

      screenVideo.play().catch(() => {});

      shareBtn.classList.add("active");

      updateStage();

      const videoTrack =
        screenStream.getVideoTracks()[0];

      if (videoTrack) {

        videoTrack.addEventListener(
          "ended",
          stopScreenShare
        );

      }

      showToast("Screen sharing started.");

    } catch (error) {

      console.error(error);

      showToast(
        "Screen sharing was cancelled."
      );

    }

  });


  function stopScreenShare() {

    if (screenStream) {

      screenStream.getTracks().forEach(track => {
        track.stop();
      });

      screenStream = null;
    }

    screenVideo.srcObject = null;

    screenVideo.style.display =
      "none";

    shareBtn.classList.remove("active");

    updateStage();

    showToast("Screen sharing stopped.");

  }


  /* =======================================================
     CLEAR STAGE
  ======================================================= */

  clearBtn.addEventListener("click", function () {

    if (isRecording) {

      showToast(
        "Stop recording before clearing the stage."
      );

      return;
    }

    mainVideo.pause();

    mainVideo.removeAttribute("src");
    mainVideo.load();

    mainImage.removeAttribute("src");

    if (screenStream) {

      stopScreenShare();

    }

    mainVideo.style.display = "none";
    mainImage.style.display = "none";
    screenVideo.style.display = "none";

    playBtn.classList.remove("active");

    updateStage();

    showToast("Main stage cleared.");

  });


  /* =======================================================
     RECORDING
  ======================================================= */

  recordBtn.addEventListener(
    "click",
    function () {

      if (isRecording) {

        stopRecording();

      } else {

        startRecording();

      }

    }
  );


  async function startRecording() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia
    ) {

      showToast(
        "Screen recording is not supported here."
      );

      return;
    }


    try {

      /*
       * We capture the browser tab/screen.
       * Chrome will show its native share dialog.
       */

      const displayStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });


      let audioTracks = [];


      if (micStream) {

        audioTracks =
          micStream.getAudioTracks();

      }


      const combinedTracks = [
        ...displayStream.getVideoTracks(),
        ...displayStream.getAudioTracks(),
        ...audioTracks
      ];


      const recordingStream =
        new MediaStream(combinedTracks);


      let mimeType = "";


      if (
        MediaRecorder.isTypeSupported(
          "video/webm;codecs=vp9,opus"
        )
      ) {

        mimeType =
          "video/webm;codecs=vp9,opus";

      } else if (
        MediaRecorder.isTypeSupported(
          "video/webm;codecs=vp8,opus"
        )
      ) {

        mimeType =
          "video/webm;codecs=vp8,opus";

      } else {

        mimeType = "video/webm";

      }


      recorder =
        new MediaRecorder(
          recordingStream,
          mimeType
            ? { mimeType }
            : undefined
        );


      recordedChunks = [];


      recorder.addEventListener(
        "dataavailable",
        function (event) {

          if (event.data &&
              event.data.size > 0) {

            recordedChunks.push(
              event.data
            );

          }

        }
      );


      recorder.addEventListener(
        "stop",
        function () {

          const finalType =
            mimeType || "video/webm";

          recordedBlob =
            new Blob(
              recordedChunks,
              { type: finalType }
            );


          if (recordedUrl) {

            URL.revokeObjectURL(
              recordedUrl
            );

          }


          recordedUrl =
            URL.createObjectURL(
              recordedBlob
            );


          previewVideo.src =
            recordedUrl;

          previewModal.classList.add("show");


          displayStream
            .getTracks()
            .forEach(track => {
              track.stop();
            });


          showToast(
            "Recording ready for preview."
          );

        }
      );


      recorder.addEventListener(
        "error",
        function (event) {

          console.error(
            "Recorder error:",
            event
          );

          showToast(
            "Recording error occurred."
          );

        }
      );


      recorder.start(1000);


      isRecording = true;
      isPaused = false;

      recordingSeconds = 0;

      recordTimer.textContent =
        "00:00";


      recordStatus.classList.add(
        "active"
      );


      recordBtn.classList.add(
        "recording"
      );


      recordBtn.querySelector(
        ".control-text"
      ).textContent = "Stop";


      pauseBtn.querySelector(
        ".control-text"
      ).textContent = "Pause";


      recordingInterval =
        setInterval(() => {

          if (!isPaused) {

            recordingSeconds++;

            recordTimer.textContent =
              formatTime(recordingSeconds);

          }

        }, 1000);


      const shareTrack =
        displayStream.getVideoTracks()[0];


      if (shareTrack) {

        shareTrack.addEventListener(
          "ended",
          function () {

            if (isRecording) {

              stopRecording();

            }

          }
        );

      }


      showToast(
        "Recording started."
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Recording cancelled."
      );

    }

  }


  function stopRecording() {

    if (
      !recorder ||
      recorder.state === "inactive"
    ) {

      return;
    }


    recorder.stop();

    isRecording = false;
    isPaused = false;


    clearInterval(
      recordingInterval
    );

    recordingInterval = null;


    recordStatus.classList.remove(
      "active"
    );


    recordBtn.classList.remove(
      "recording"
    );


    recordBtn.querySelector(
      ".control-text"
    ).textContent = "Record";


    pauseBtn.querySelector(
      ".control-text"
    ).textContent = "Pause";


    showToast(
      "Recording stopped."
    );

  }


  /* =======================================================
     PAUSE / RESUME
  ======================================================= */

  pauseBtn.addEventListener(
    "click",
    function () {

      if (!recorder) {

        showToast(
          "Start recording first."
        );

        return;
      }


      if (
        recorder.state === "inactive"
      ) {

        showToast(
          "Start recording first."
        );

        return;
      }


      if (!isPaused) {

        if (
          recorder.state === "recording"
        ) {

          recorder.pause();

          isPaused = true;

          pauseBtn.classList.add(
            "active"
          );

          pauseBtn.querySelector(
            ".control-text"
          ).textContent = "Resume";

          showToast(
            "Recording paused."
          );

        }

      } else {

        if (
          recorder.state === "paused"
        ) {

          recorder.resume();

          isPaused = false;

          pauseBtn.classList.remove(
            "active"
          );

          pauseBtn.querySelector(
            ".control-text"
          ).textContent = "Pause";

          showToast(
            "Recording resumed."
          );

        }

      }

    }
  );


  /* =======================================================
     FULLSCREEN
  ======================================================= */

  fullscreenBtn.addEventListener(
    "click",
    async function () {

      try {

        if (!document.fullscreenElement) {

          await stage.requestFullscreen();

          showToast(
            "Stage fullscreen enabled."
          );

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(error);

        showToast(
          "Fullscreen is not available."
        );

      }

    }
  );


  document.addEventListener(
    "fullscreenchange",
    function () {

      fullscreenBtn.classList.toggle(
        "active",
        !!document.fullscreenElement
      );

    }
  );


  /* =======================================================
     STUDENTS PANEL
  ======================================================= */

  studentsToggle.addEventListener(
    "click",
    function () {

      studentsPanel.classList.toggle(
        "show"
      );

    }
  );


  /* =======================================================
     SETTINGS
  ======================================================= */

  settingsBtn.addEventListener(
    "click",
    function () {

      settingsPanel.classList.add(
        "show"
      );

      classNameInput.value =
        localStorage.getItem(
          "ushaLiveClassName"
        ) || "My Live Class";


      voiceApiInput.value =
        localStorage.getItem(
          "ushaLiveVoiceApi"
        ) || "";

    }
  );


  closeSettings.addEventListener(
    "click",
    function () {

      settingsPanel.classList.remove(
        "show"
      );

    }
  );


  saveSettings.addEventListener(
    "click",
    function () {

      const name =
        classNameInput.value.trim() ||
        "My Live Class";


      localStorage.setItem(
        "ushaLiveClassName",
        name
      );


      localStorage.setItem(
        "ushaLiveVoiceApi",
        voiceApiInput.value.trim()
      );


      className.textContent =
        name;


      settingsPanel.classList.remove(
        "show"
      );


      showToast(
        "Settings saved."
      );

    }
  );


  className.textContent =
    localStorage.getItem(
      "ushaLiveClassName"
    ) || "My Live Class";


  /* =======================================================
     PREVIEW
  ======================================================= */

  function closePreviewModal() {

    previewModal.classList.remove(
      "show"
    );

    previewVideo.pause();

  }


  closePreview.addEventListener(
    "click",
    closePreviewModal
  );


  closePreview2.addEventListener(
    "click",
    closePreviewModal
  );


  previewModal.addEventListener(
    "click",
    function (event) {

      if (
        event.target === previewModal
      ) {

        closePreviewModal();

      }

    }
  );


  /* =======================================================
     DOWNLOAD
  ======================================================= */

  downloadRecording.addEventListener(
    "click",
    function () {

      if (!recordedUrl) {

        showToast(
          "No recording available."
        );

        return;
      }


      const link =
        document.createElement("a");


      const safeName =
        (
          localStorage.getItem(
            "ushaLiveClassName"
          ) || "UshaLiveAI-Class"
        )
        .replace(
          /[^a-z0-9-_]+/gi,
          "-"
        )
        .replace(
          /-+/g,
          "-"
        )
        .replace(
          /^-|$/g,
          ""
        );


      link.href =
        recordedUrl;


      link.download =
        safeName +
        "-" +
        new Date()
          .toISOString()
          .slice(0,19)
          .replace(
            /[:T]/g,
            "-"
          ) +
        ".webm";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      showToast(
        "Download started."
      );

    }
  );


  /* =======================================================
     END STUDIO
  ======================================================= */

  endBtn.addEventListener(
    "click",
    function () {

      if (isRecording) {

        const confirmed =
          confirm(
            "Recording is still running. End the studio and stop recording?"
          );


        if (!confirmed) {

          return;

        }


        stopRecording();

      } else {

        const confirmed =
          confirm(
            "Are you sure you want to end the studio?"
          );


        if (!confirmed) {

          return;

        }

      }


      cleanup();


      window.location.href =
        "../dashboard/";

    }
  );


  /* =======================================================
     LOGOUT
  ======================================================= */

  logoutBtn.addEventListener(
    "click",
    function () {

      if (isRecording) {

        const confirmed =
          confirm(
            "A recording is running. Logout anyway?"
          );


        if (!confirmed) {

          return;

        }

        stopRecording();

      }


      cleanup();


      /*
       * Firebase auth logout will be attempted
       * separately. If unavailable, dashboard
       * navigation still happens.
       */

      try {

        import("../firebase.js")
          .then(({ auth }) => {

            return import(
              "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
            )
            .then(({ signOut }) => {

              return signOut(auth);

            });

          })
          .catch(() => {})
          .finally(() => {

            window.location.href =
              "../login/";

          });

      } catch (_) {

        window.location.href =
          "../login/";

      }

    }
  );


  /* =======================================================
     KEYBOARD SHORTCUTS
  ======================================================= */

  document.addEventListener(
    "keydown",
    function (event) {

      const target =
        event.target;


      const typing =
        target &&
        (
          target.tagName === "INPUT" ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable
        );


      if (typing) return;


      if (
        event.key.toLowerCase() === "r"
      ) {

        recordBtn.click();

      }


      if (
        event.code === "Space"
      ) {

        event.preventDefault();

        pauseBtn.click();

      }


      if (
        event.key.toLowerCase() === "f"
      ) {

        fullscreenBtn.click();

      }


      if (
        event.key.toLowerCase() === "m"
      ) {

        micBtn.click();

      }


      if (
        event.key.toLowerCase() === "c"
      ) {

        cameraBtn.click();

      }


      if (
        event.key.toLowerCase() === "s"
      ) {

        shareBtn.click();

      }


      if (
        event.key === "Escape"
      ) {

        settingsPanel.classList.remove(
          "show"
        );

        previewModal.classList.remove(
          "show"
        );

        studentsPanel.classList.remove(
          "show"
        );

      }

    }
  );


  /* =======================================================
     BEFORE UNLOAD
  ======================================================= */

  window.addEventListener(
    "beforeunload",
    function (event) {

      if (isRecording) {

        event.preventDefault();

        event.returnValue = "";

      }

    }
  );


  /* =======================================================
     CLEANUP
  ======================================================= */

  function cleanup() {

    stopCamera();
    stopMic();
    stopScreenShare();


    if (
      recorder &&
      recorder.state !== "inactive"
    ) {

      try {

        recorder.stop();

      } catch (_) {}

    }


    clearInterval(
      recordingInterval
    );

    clearInterval(
      sessionInterval
    );


    if (videoObjectUrl) {

      URL.revokeObjectURL(
        videoObjectUrl
      );

      videoObjectUrl = null;

    }


    if (slideObjectUrl) {

      URL.revokeObjectURL(
        slideObjectUrl
      );

      slideObjectUrl = null;

    }


    if (recordedUrl) {

      URL.revokeObjectURL(
        recordedUrl
      );

      recordedUrl = null;

    }

  }


  /* =======================================================
     MOBILE STUDENTS
  ======================================================= */

  document.addEventListener(
    "click",
    function (event) {

      if (
        window.innerWidth > 900
      ) return;


      if (
        studentsPanel.classList.contains(
          "show"
        )
      ) {

        const clickedPanel =
          studentsPanel.contains(
            event.target
          );

        const clickedButton =
          studentsToggle.contains(
            event.target
          );


        if (
          !clickedPanel &&
          !clickedButton
        ) {

          studentsPanel.classList.remove(
            "show"
          );

        }

      }

    }
  );


  /* =======================================================
     DEFAULT STUDENT DEMO
  ======================================================= */

  function loadDemoStudents() {

    const students = [
      {
        name: "Student One",
        status: "Online"
      },
      {
        name: "Student Two",
        status: "Online"
      },
      {
        name: "Student Three",
        status: "Online"
      }
    ];


    const list =
      $("studentsList");


    list.innerHTML = "";


    students.forEach(
      function (student) {

        const item =
          document.createElement("div");

        item.className =
          "student";


        item.innerHTML = `
          <div class="avatar">👤</div>
          <div class="student-info">
            <strong>${student.name}</strong>
            <span>${student.status}</span>
          </div>
          <span class="online-dot"></span>
        `;


        list.appendChild(
          item
        );

      }
    );


    $("studentCount").textContent =
      students.length;

  }


  loadDemoStudents();


  /* =======================================================
     INITIAL MESSAGE
  ======================================================= */

  setTimeout(
    function () {

      showToast(
        "Mentor Studio ready."
      );

    },
    500
  );


  console.log(
    "UshaLiveAI Mentor Studio initialized successfully."
  );

})();
</script>


<!-- =======================================================
     OPTIONAL FIREBASE AUTH
     Runs separately so Firebase failure cannot break UI
======================================================= -->

<script type="module">

  try {

    const firebase =
      await import("../firebase.js");

    const authModule =
      await import(
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
      );

    const {
      onAuthStateChanged
    } = authModule;


    onAuthStateChanged(
      firebase.auth,
      function (user) {

        if (!user) {

          /*
           * During local testing, this redirect can
           * be commented if needed.
           */

          console.log(
            "No Firebase user detected."
          );

        } else {

          console.log(
            "Mentor logged in:",
            user.email
          );

        }

      }
    );

  } catch (error) {

    console.warn(
      "Firebase authentication layer unavailable. Core studio remains active.",
      error
    );

  }

</script>
