<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mentor Studio | UshaLiveAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070b;
      --panel: rgba(15, 18, 25, .88);
      --panel-2: rgba(24, 28, 38, .92);
      --border: rgba(255,255,255,.09);
      --text: #f7f8fb;
      --muted: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 10%, rgba(59,130,246,.10), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(139,92,246,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    /* =====================================================
       STUDIO
    ===================================================== */

    .studio {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,9,14,.88);
      backdrop-filter: blur(20px);
      z-index: 30;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg,#6366f1,#8b5cf6);
      box-shadow: 0 8px 25px rgba(99,102,241,.28);
      font-size: 18px;
      font-weight: 800;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .studio-name {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .class-area {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .class-title {
      font-size: 14px;
      font-weight: 700;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6b7280;
    }

    .live-dot.active {
      background: var(--red);
      box-shadow: 0 0 10px rgba(239,68,68,.8);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-chip {
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 11px;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor: pointer;
    }

    .top-btn:hover {
      background: rgba(255,255,255,.09);
    }

    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .main-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) 285px;
      gap: 0;
    }

    /* =====================================================
       STAGE
    ===================================================== */

    .stage-area {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 40%, rgba(50,60,80,.25), transparent 50%),
        #080b11;
      box-shadow: var(--shadow);
    }

    .stage.empty::before {
      content: "Main Video / Screen";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.12);
      font-size: clamp(22px,4vw,46px);
      font-weight: 800;
      letter-spacing: -1px;
      pointer-events: none;
    }

    #screenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000;
    }

    .stage-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.22),
          transparent 20%,
          transparent 70%,
          rgba(0,0,0,.45)
        );
    }

    .stage-info {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .stage-badge {
      padding: 7px 10px;
      border-radius: 9px;
      background: rgba(0,0,0,.52);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      font-size: 11px;
      color: #e5e7eb;
    }

    .record-badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 9px;
      background: rgba(239,68,68,.16);
      border: 1px solid rgba(239,68,68,.35);
      color: #fecaca;
      font-size: 11px;
      font-weight: 700;
    }

    .record-badge.show {
      display: inline-flex;
    }

    .record-small-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: .35; }
    }

    /* =====================================================
       MENTOR CAMERA PIP
    ===================================================== */

    .mentor-pip {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 190px;
      aspect-ratio: 16 / 10;
      border-radius: 15px;
      overflow: hidden;
      background: #111827;
      border: 2px solid rgba(255,255,255,.16);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
      z-index: 10;
      cursor: grab;
    }

    .mentor-pip:active {
      cursor: grabbing;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scaleX(-1);
    }

    .camera-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #252b38, #11141b);
      color: #9ca3af;
      font-size: 12px;
    }

    .pip-name {
      position: absolute;
      left: 8px;
      bottom: 7px;
      padding: 4px 7px;
      border-radius: 6px;
      background: rgba(0,0,0,.6);
      font-size: 9px;
      color: #fff;
    }

    /* =====================================================
       PARTICIPANTS
    ===================================================== */

    .participants {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background: rgba(10,13,19,.94);
      backdrop-filter: blur(20px);
    }

    .participants-header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .participants-title {
      font-size: 14px;
      font-weight: 800;
    }

    .participant-count {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: rgba(59,130,246,.14);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 800;
    }

    .student-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
    }

    .student {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 4px;
      border-radius: 11px;
    }

    .student:hover {
      background: rgba(255,255,255,.04);
    }

    .student-avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#263247,#18202d);
      border: 1px solid rgba(255,255,255,.07);
      font-size: 14px;
    }

    .student-info {
      min-width: 0;
      flex: 1;
    }

    .student-name {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .student-status {
      margin-top: 2px;
      font-size: 9px;
      color: #6ee7b7;
    }

    .student-more {
      color: #6b7280;
      font-size: 16px;
    }

    .empty-students {
      padding: 35px 15px;
      text-align: center;
      color: #6b7280;
      font-size: 11px;
      line-height: 1.6;
    }

    /* =====================================================
       BOTTOM CONTROL BAR
    ===================================================== */

    .control-wrap {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(850px, calc(100% - 30px));
    }

    .control-bar {
      min-height: 72px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(13,16,23,.86);
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0,0,0,.48);
    }

    .control {
      min-width: 64px;
      height: 54px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      color: #d1d5db;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: .18s ease;
    }

    .control:hover {
      background: rgba(255,255,255,.09);
      transform: translateY(-1px);
    }

    .control.active {
      background: rgba(59,130,246,.15);
      border-color: rgba(59,130,246,.35);
      color: #93c5fd;
    }

    .control .icon {
      font-size: 18px;
      line-height: 1;
    }

    .control .label {
      font-size: 9px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 38px;
      background: rgba(255,255,255,.09);
      margin: 0 3px;
    }

    .record-btn {
      min-width: 80px;
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.25);
      color: #fca5a5;
    }

    .record-btn:hover {
      background: rgba(239,68,68,.20);
    }

    .record-btn.recording {
      background: rgba(239,68,68,.22);
      border-color: rgba(239,68,68,.55);
      color: #fecaca;
    }

    .pause-btn {
      display: none;
    }

    .pause-btn.show {
      display: flex;
    }

    .end-btn {
      min-width: 78px;
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fee2e2;
    }

    .end-btn:hover {
      background: #991b1b;
    }

    /* =====================================================
       PREVIEW MODAL
    ===================================================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(12px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(850px,100%);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #0d1017;
      box-shadow: 0 30px 90px rgba(0,0,0,.65);
    }

    .modal-header {
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }

    .close-modal {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,.04);
      color: #fff;
      cursor: pointer;
    }

    .preview-video {
      width: 100%;
      max-height: 60vh;
      display: block;
      background: #000;
    }

    .modal-actions {
      padding: 15px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .modal-btn {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.05);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .download-btn {
      background: #2563eb;
      border-color: #2563eb;
    }

    .discard-btn {
      background: rgba(239,68,68,.10);
      color: #fca5a5;
      border-color: rgba(239,68,68,.22);
    }

    /* =====================================================
       SETTINGS
    ===================================================== */

    .settings-panel {
      position: fixed;
      top: 74px;
      right: 15px;
      z-index: 50;
      width: 320px;
      display: none;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(13,16,23,.96);
      backdrop-filter: blur(25px);
      box-shadow: var(--shadow);
    }

    .settings-panel.show {
      display: block;
    }

    .settings-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .setting-group {
      margin-bottom: 14px;
    }

    .setting-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .setting-input {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: rgba(255,255,255,.04);
      color: #fff;
    }

    .setting-input:focus {
      border-color: rgba(99,102,241,.6);
    }

    .voice-clone {
      padding: 12px;
      border: 1px solid rgba(139,92,246,.2);
      border-radius: 11px;
      background: rgba(139,92,246,.07);
    }

    .voice-clone strong {
      font-size: 11px;
    }

    .voice-clone p {
      margin-top: 4px;
      color: #9ca3af;
      font-size: 9px;
      line-height: 1.5;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;
      left: 50%;
      top: 78px;
      transform: translateX(-50%) translateY(-10px);
      z-index: 200;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(17,24,39,.95);
      color: #e5e7eb;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      body {
        overflow: hidden;
      }

      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        font-size: 13px;
      }

      .studio-name {
        display: none;
      }

      .class-area {
        position: static;
        transform: none;
        margin-left: auto;
        margin-right: auto;
      }

      .class-title {
        font-size: 12px;
      }

      .user-chip {
        display: none;
      }

      .main-layout {
        display: block;
        position: relative;
      }

      .stage-area {
        height: 100%;
        padding: 8px;
      }

      .stage {
        border-radius: 13px;
      }

      .participants {
        position: absolute;
        right: 8px;
        top: 8px;
        bottom: 92px;
        width: min(280px,82vw);
        z-index: 25;
        display: none;
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .participants.mobile-open {
        display: flex;
      }

      .mentor-pip {
        width: 125px;
        right: 12px;
        bottom: 105px;
        border-radius: 11px;
      }

      .control-wrap {
        bottom: 8px;
        width: calc(100% - 16px);
      }

      .control-bar {
        min-height: 65px;
        padding: 7px 5px;
        gap: 3px;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
        border-radius: 15px;
      }

      .control-bar::-webkit-scrollbar {
        display: none;
      }

      .control {
        min-width: 54px;
        height: 49px;
        padding: 0 6px;
      }

      .control .icon {
        font-size: 16px;
      }

      .control .label {
        font-size: 8px;
      }

      .divider {
        height: 30px;
      }

      .settings-panel {
        top: 65px;
        right: 8px;
        width: calc(100% - 16px);
      }

      .stage-info {
        top: 8px;
        left: 8px;
      }

      .stage-badge,
      .record-badge {
        padding: 6px 8px;
      }
    }

    @media (max-width: 500px) {

      .top-actions .top-btn:first-child {
        display: none;
      }

      .class-area {
        max-width: 150px;
      }

      .class-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mentor-pip {
        width: 105px;
      }

      .control {
        min-width: 50px;
      }

      .record-btn {
        min-width: 60px;
      }

      .end-btn {
        min-width: 60px;
      }
    }
  </style>
</head>

<body>

<div class="studio">

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topbar">

    <div class="brand-area">

      <div class="brand-logo">
        U
      </div>

      <div class="brand-text">
        <div class="brand-name">
          UshaLiveAI
        </div>

        <div class="studio-name">
          Mentor Live Studio
        </div>
      </div>

    </div>

    <div class="class-area">

      <div
        class="class-title"
        id="classTitle"
      >
        Personal Class
      </div>

      <div class="live-status">

        <span
          class="live-dot"
          id="liveDot"
        ></span>

        <span id="liveText">
          READY
        </span>

      </div>

    </div>

    <div class="top-actions">

      <div
        class="user-chip"
        id="userEmail"
      >
        Checking account...
      </div>

      <button
        class="top-btn"
        id="participantsToggle"
        title="Students"
      >
        👥
      </button>

      <button
        class="top-btn"
        id="settingsBtn"
        title="Settings"
      >
        ⚙
      </button>

      <button
        class="top-btn"
        id="logoutBtn"
        title="Logout"
      >
        ↪
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main-layout">

    <!-- ===================================================
         STAGE
    ==================================================== -->

    <section class="stage-area">

      <div
        class="stage empty"
        id="stage"
      >

        <div class="stage-info">

          <div class="stage-badge">
            🎬 Main Video / Screen
          </div>

          <div
            class="record-badge"
            id="recordBadge"
          >

            <span class="record-small-dot"></span>

            <span id="recordBadgeText">
              RECORDING
            </span>

          </div>

        </div>


        <video
          id="screenVideo"
          autoplay
          muted
          playsinline
        ></video>


        <video
          id="mainVideo"
          autoplay
          muted
          playsinline
        ></video>


        <div class="stage-gradient"></div>


        <!-- Mentor Camera -->

        <div
          class="mentor-pip"
          id="mentorPip"
        >

          <video
            id="cameraVideo"
            autoplay
            muted
            playsinline
          ></video>

          <div
            class="camera-placeholder"
            id="cameraPlaceholder"
          >
            Camera Off
          </div>

          <div class="pip-name">
            Mentor
          </div>

        </div>


        <!-- Controls -->

        <div class="control-wrap">

          <div class="control-bar">

            <button
              class="control"
              id="micBtn"
            >
              <span class="icon">🎙</span>
              <span class="label">Mic</span>
            </button>


            <button
              class="control"
              id="cameraBtn"
            >
              <span class="icon">📷</span>
              <span class="label">Camera</span>
            </button>


            <button
              class="control"
              id="screenBtn"
            >
              <span class="icon">🖥</span>
              <span class="label">Share Screen</span>
            </button>


            <button
              class="control"
              id="mainVideoBtn"
            >
              <span class="icon">🎬</span>
              <span class="label">Main Video</span>
            </button>


            <button
              class="control"
              id="studentsBtn"
            >
              <span class="icon">👥</span>
              <span class="label">Students</span>
            </button>


            <div class="divider"></div>


            <button

  function renderStudents(students) {

    studentCount.textContent =

    if (!students.length) {

      studentList.innerHTML = `

            </div>

        `;

      }).join("");

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     CANVAS RECORDER
  ====================================================== */

  function setupCanvas() {

    canvas =
      document.createElement(
        "canvas"
      );

    canvas.width = 1280;
    canvas.height = 720;

    canvasContext =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );

  }


  function drawRecordingFrame() {

    if (!canvas || !canvasContext) {
      return;
    }

    const ctx =
      canvasContext;

    const width =
      canvas.width;

    const height =
      canvas.height;


    /* Background */

    ctx.fillStyle =
      "#080b11";

    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    /* Main video */

    let sourceVideo = null;

    if (
      currentMode === "screen" &&
      screenEnabled &&
      screenVideo.readyState >= 2
    ) {

      sourceVideo =
        screenVideo;

    } else if (
      mainVideo.readyState >= 2 &&
      mainVideo.style.display !== "none"
    ) {

      sourceVideo =
        mainVideo;

    } else if (
      screenVideo.readyState >= 2 &&
      screenEnabled
    ) {

      sourceVideo =
        screenVideo;

    }


    if (sourceVideo) {

      drawContain(
        ctx,
        sourceVideo,
        0,
        0,
        width,
        height
      );

    }


    /* Mentor camera PIP */

    if (
      cameraEnabled &&
      cameraVideo.readyState >= 2
    ) {

      const pipWidth =
        300;

      const pipHeight =
        190;

      const pipX =
        width -
        pipWidth -
        28;

      const pipY =
        height -
        pipHeight -
        28;

      ctx.save();

      ctx.beginPath();

      roundRect(
        ctx,
        pipX,
        pipY,
        pipWidth,
        pipHeight,
        18
      );

      ctx.clip();

      ctx.scale(
        -1,
        1
      );

      ctx.drawImage(
        cameraVideo,
        -pipX - pipWidth,
        pipY,
        pipWidth,
        pipHeight
      );

      ctx.restore();

      ctx.save();

      ctx.strokeStyle =
        "rgba(255,255,255,.30)";

      ctx.lineWidth =
        3;

      roundRect(
        ctx,
        pipX,
        pipY,
        pipWidth,
        pipHeight,
        18
      );

      ctx.stroke();

      ctx.restore();

    }


    canvasAnimation =
      requestAnimationFrame(
        drawRecordingFrame
      );

  }


  function drawContain(
    ctx,
    video,
    x,
    y,
    width,
    height
  ) {

    const vw =
      video.videoWidth ||
      width;

    const vh =
      video.videoHeight ||
      height;

    const videoRatio =
      vw / vh;

    const boxRatio =
      width / height;

    let drawWidth =
      width;

    let drawHeight =
      height;

    let drawX =
      x;

    let drawY =
      y;

    if (videoRatio > boxRatio) {

      drawHeight =
        width / videoRatio;

      drawY =
        y +
        (height - drawHeight) / 2;

    } else {

      drawWidth =
        height * videoRatio;

      drawX =
        x +
        (width - drawWidth) / 2;

    }

    ctx.drawImage(
      video,
      drawX,
      drawY,
      drawWidth,
      drawHeight
    );

  }


  function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x + radius,
      y
    );

    ctx.lineTo(
      x + width - radius,
      y
    );

    ctx.quadraticCurveTo(
      x + width,
      y,
      x + width,
      y + radius
    );

    ctx.lineTo(
      x + width,
      y + height - radius
    );

    ctx.quadraticCurveTo(
      x + width,
      y + height,
      x + width - radius,
      y + height
    );

    ctx.lineTo(
      x + radius,
      y + height
    );

    ctx.quadraticCurveTo(
      x,
      y + height,
      x,
      y + height - radius
    );

    ctx.lineTo(
      x,
      y + radius
    );

    ctx.quadraticCurveTo(
      x,
      y,
      x + radius,
      y
    );

    ctx.closePath();

  }


  /* =====================================================
     RECORDING AUDIO
  ====================================================== */

  function buildRecordingStream() {

    setupCanvas();

    const canvasStream =
      canvas.captureStream(30);

    recordingStream =
      new MediaStream();

    canvasStream
      .getVideoTracks()
      .forEach(track => {

        recordingStream.addTrack(
          track
        );

      });


    /*
      Microphone audio
    */

    if (micEnabled && micStream) {

      micStream
        .getAudioTracks()
        .forEach(track => {

          recordingStream.addTrack(
            track
          );

        });

    }

  }


  /* =====================================================
     START RECORDING
  ====================================================== */

  async function startRecording() {

    if (!screenEnabled && !cameraEnabled) {

      showToast(
        "Turn on Camera or Share Screen first."
      );

      return;

    }

    if (!micEnabled) {

      await enableMic();

    }


    try {

      buildRecordingStream();

      recordedChunks = [];

      let mimeType =
        "video/webm;codecs=vp9,opus";

      if (
        !MediaRecorder.isTypeSupported(
          mimeType
        )
      ) {

        mimeType =
          "video/webm;codecs=vp8,opus";

      }

      if (
        !MediaRecorder.isTypeSupported(
          mimeType
        )
      ) {

        mimeType =
          "video/webm";

      }


      mediaRecorder =
        new MediaRecorder(
          recordingStream,
          {
            mimeType,
            videoBitsPerSecond:
              4000000
          }
        );


      mediaRecorder.ondataavailable =
        event => {

          if (
            event.data &&
            event.data.size > 0
          ) {

            recordedChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        handleRecordingStop;


      mediaRecorder.onerror =
        event => {

          console.error(
            "MediaRecorder error:",
            event
          );

          showToast(
            "Recording error occurred."
          );

        };


      mediaRecorder.start(
        1000
      );


      isRecording = true;
      isPaused = false;

      liveDot.classList.add(
        "active"
      );

      liveText.textContent =
        "LIVE";

      recordBtn.classList.add(
        "recording"
      );

      recordIcon.textContent =
        "⏹";

      recordText.textContent =
        "Stop";

      pauseBtn.classList.add(
        "show"
      );

      pauseIcon.textContent =
        "⏸";

      pauseText.textContent =
        "Pause";

      recordBadge.classList.add(
        "show"
      );

      recordBadgeText.textContent =
        "RECORDING";

      drawRecordingFrame();

      showToast(
        "Recording started"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Could not start recording."
      );

    }

  }


  /* =====================================================
     PAUSE / RESUME
  ====================================================== */

  function togglePause() {

    if (
      !mediaRecorder ||
      !isRecording
    ) {
      return;
    }

    if (
      mediaRecorder.state ===
      "recording"
    ) {

      mediaRecorder.pause();

      isPaused = true;

      pauseIcon.textContent =
        "▶";

      pauseText.textContent =
        "Resume";

      recordBadgeText.textContent =
        "PAUSED";

      showToast(
        "Recording paused"
      );

      return;

    }


    if (
      mediaRecorder.state ===
      "paused"
    ) {

      mediaRecorder.resume();

      isPaused = false;

      pauseIcon.textContent =
        "⏸";

      pauseText.textContent =
        "Pause";

      recordBadgeText.textContent =
        "RECORDING";

      showToast(
        "Recording resumed"
      );

    }

  }


  pauseBtn.addEventListener(
    "click",
    togglePause
  );


  /* =====================================================
     STOP RECORDING
  ====================================================== */

  function stopRecording() {

    if (
      !mediaRecorder ||
      !isRecording
    ) {

      return;

    }

    if (
      mediaRecorder.state !==
      "inactive"
    ) {

      mediaRecorder.stop();

    }

    isRecording = false;
    isPaused = false;

    recordBtn.classList.remove(
      "recording"
    );

    recordIcon.textContent =
      "🔴";

    recordText.textContent =
      "Record";

    pauseBtn.classList.remove(
      "show"
    );

    liveDot.classList.remove(
      "active"
    );

    liveText.textContent =
      "READY";

    recordBadge.classList.remove(
      "show"
    );

    if (canvasAnimation) {

      cancelAnimationFrame(
        canvasAnimation
      );

      canvasAnimation = null;

    }

  }


  recordBtn.addEventListener(
    "click",
    () => {

      if (isRecording) {

        stopRecording();

      } else {

        startRecording();

      }

    }
  );


  /* =====================================================
     RECORDING STOP HANDLER
  ====================================================== */

  function handleRecordingStop() {

    if (
      !recordedChunks.length
    ) {

      showToast(
        "No recording data was created."
      );

      cleanupRecordingStream();

      return;

    }

    recordedBlob =
      new Blob(
        recordedChunks,
        {
          type:
            "video/webm"
        }
      );

    if (recordingUrl) {

      URL.revokeObjectURL(
        recordingUrl
      );

    }

    recordingUrl =
      URL.createObjectURL(
        recordedBlob
      );

    previewVideo.src =
      recordingUrl;

    previewModal.classList.add(
      "show"
    );

    cleanupRecordingStream();

    showToast(
      "Recording ready"
    );

  }


  function cleanupRecordingStream() {

    if (recordingStream) {

      recordingStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      recordingStream = null;

    }

  }


  /* =====================================================
     DOWNLOAD
  ====================================================== */

  downloadBtn.addEventListener(
    "click",
    () => {

      if (!recordingUrl) {

        return;

      }

      const link =
        document.createElement("a");

      link.href =
        recordingUrl;

      const safeTitle =
        (
          classTitle.textContent ||
          "usha-live-class"
        )
          .replace(
            /[^a-z0-9-_]+/gi,
            "-"
          )
          .replace(
            /-+/g,
            "-"
          )
          .replace(
            /^-|-$/g,
            ""
          );

      link.download =
        `${safeTitle || "usha-live-class"}-${Date.now()}.webm`;

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      showToast(
        "Download started"
      );

    }
  );


  /* =====================================================
     DISCARD
  ====================================================== */

  function discardRecording() {

    previewVideo.pause();

    previewVideo.removeAttribute(
      "src"
    );

    previewVideo.load();

    previewModal.classList.remove(
      "show"
    );

    if (recordingUrl) {

      URL.revokeObjectURL(
        recordingUrl
      );

    }

    recordingUrl = null;
    recordedBlob = null;
    recordedChunks = [];

    showToast(
      "Recording deleted"
    );

  }


  discardBtn.addEventListener(
    "click",
    discardRecording
  );


  closePreview.addEventListener(
    "click",
    () => {

      previewModal.classList.remove(
        "show"
      );

    }
  );


  /* =====================================================
     FULLSCREEN
  ====================================================== */

  fullscreenBtn.addEventListener(
    "click",
    async () => {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document.documentElement.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(error);

        showToast(
          "Fullscreen is not available."
        );

      }

    }
  );


  /* =====================================================
     SETTINGS
  ====================================================== */

  settingsBtn.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      settingsPanel.classList.toggle(
        "show"
      );

    }
  );


  document.addEventListener(
    "click",
    event => {

      if (
        !settingsPanel.contains(
          event.target
        ) &&
        event.target !== settingsBtn
      ) {

        settingsPanel.classList.remove(
          "show"
        );

      }

    }
  );


  /* =====================================================
     LOGOUT
  ====================================================== */

  logoutBtn.addEventListener(
    "click",
    async () => {

      if (isRecording) {

        const confirmed =
          confirm(
            "A recording is currently running. End studio and stop recording?"
          );

        if (!confirmed) {
          return;
        }

        stopRecording();

      }

      try {

        await signOut(auth);

        window.location.href =
          "../login/";

      } catch (error) {

        console.error(error);

        showToast(
          "Logout failed."
        );

      }

    }
  );


  /* =====================================================
     END STUDIO
  ====================================================== */

  endBtn.addEventListener(
    "click",
    () => {

      if (isRecording) {

        const confirmed =
          confirm(
            "Recording is active. End Studio and stop the recording?"
          );

        if (!confirmed) {
          return;
        }

        stopRecording();

        setTimeout(
          cleanupStudio,
          250
        );

      } else {

        cleanupStudio();

      }

    }
  );


  function cleanupStudio() {

    disableScreen();

    disableCamera();

    disableMic();

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      cameraStream = null;

    }

    if (micStream) {

      micStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      micStream = null;

    }

    showToast(
      "Studio ended"
    );

    setTimeout(
      () => {

        window.location.href =
          "../dashboard/";

      },
      700
    );

  }


  /* =====================================================
     MENTOR CAMERA DRAG
  ====================================================== */

  mentorPip.addEventListener(
    "pointerdown",
    event => {

      if (
        window.innerWidth < 850
      ) {

        return;

      }

      dragActive = true;

      mentorPip.setPointerCapture(
        event.pointerId
      );

      const rect =
        mentorPip.getBoundingClientRect();

      dragOffsetX =
        event.clientX -
        rect.left;

      dragOffsetY =
        event.clientY -
        rect.top;

    }
  );


  mentorPip.addEventListener(
    "pointermove",
    event => {

      if (!dragActive) {
        return;
      }

      const stageRect =
        stage.getBoundingClientRect();

      const pipRect =
        mentorPip.getBoundingClientRect();

      let left =
        event.clientX -
        stageRect.left -
        dragOffsetX;

      let top =
        event.clientY -
        stageRect.top -
        dragOffsetY;

      const maxLeft =
        stageRect.width -
        pipRect.width -
        10;

      const maxTop =
        stageRect.height -
        pipRect.height -
        10;

      left =
        Math.max(
          10,
          Math.min(
            left,
            maxLeft
          )
        );

      top =
        Math.max(
          10,
          Math.min(
            top,
            maxTop
          )
        );

      mentorPip.style.left =
        `${left}px`;

      mentorPip.style.top =
        `${top}px`;

      mentorPip.style.right =
        "auto";

      mentorPip.style.bottom =
        "auto";

    }
  );


  mentorPip.addEventListener(
    "pointerup",
    () => {

      dragActive = false;

    }
  );


  mentorPip.addEventListener(
    "pointercancel",
    () => {

      dragActive = false;

    }
  );


  /* =====================================================
     KEYBOARD SHORTCUTS
  ====================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.target.tagName ===
          "INPUT" ||
        event.target.tagName ===
          "TEXTAREA"
      ) {

        return;

      }


      if (
        event.code ===
        "Space"
      ) {

        event.preventDefault();

        if (isRecording) {

          togglePause();

        }

      }


      if (
        event.ctrlKey &&
        event.shiftKey &&
        event.code === "KeyR"
      ) {

        event.preventDefault();

        if (isRecording) {

          stopRecording();

        } else {

          startRecording();

        }

      }

    }
  );


  /* =====================================================
     CLEANUP
  ====================================================== */

  window.addEventListener(
    "beforeunload",
    () => {

      if (canvasAnimation) {

        cancelAnimationFrame(
          canvasAnimation
        );

      }

      [
        cameraStream,
        micStream,
        screenStream,
        recordingStream
      ].forEach(stream => {

        if (stream) {

          stream
            .getTracks()
            .forEach(track => {
              track.stop();
            });

        }

      });

    }
  );


</script>

</body>
</html>
