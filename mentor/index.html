<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070c">

<title>UshaLiveAI — Mentor Studio</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05070c;
  --panel:#0b1018;
  --panel2:#111823;
  --border:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#8994a7;
  --blue:#5b8cff;
  --green:#20d68b;
  --red:#ff465c;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(80,100,190,.12),
      transparent 32%
    ),
    #05070c;
  color:var(--text);
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

/* =========================================================
   APP
========================================================= */

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  height:64px;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(6,9,15,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  position:relative;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(
    135deg,
    #5b8cff,
    #8b5cff
  );
  font-weight:900;
}

.brand-info strong{
  display:block;
  font-size:14px;
}

.brand-info span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.top-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
}

.class-name{
  font-size:12px;
  color:#dce3ee;
}

.live-badge{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  color:#ff6b7b;
  background:rgba(255,70,92,.09);
  border:1px solid rgba(255,70,92,.22);
  font-size:9px;
  font-weight:800;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 12px var(--red);
}

.top-actions{
  display:flex;
  gap:7px;
}

.top-btn{
  width:38px;
  height:38px;
  border-radius:10px;
  color:#dce4ef;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 285px;
}

/* =========================================================
   STAGE AREA
========================================================= */

.stage-wrap{
  min-width:0;
  min-height:0;
  padding:13px;
  display:flex;
}

.stage{
  width:100%;
  height:100%;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:17px;
  background:#080b11;
  border:1px solid var(--border);
  box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

.stage-grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(
      rgba(255,255,255,.03) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.03) 1px,
      transparent 1px
    );
  background-size:40px 40px;
}

/* =========================================================
   MAIN VIDEO
========================================================= */

#mainVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;

  /*
     IMPORTANT:
     Full stage fill
  */
  object-fit:cover;

  background:#000;
  z-index:2;
}

#mainImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  object-fit:contain;
  background:#000;
  z-index:2;
}

#screenVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  object-fit:contain;
  background:#000;
  z-index:2;
}

/* =========================================================
   EMPTY STAGE
========================================================= */

.stage-placeholder{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.placeholder-content{
  max-width:420px;
  padding:30px;
}

.placeholder-icon{
  width:78px;
  height:78px;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  font-size:33px;
}

.placeholder-content h2{
  font-size:21px;
  margin-bottom:8px;
}

.placeholder-content p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

/* =========================================================
   DRAGGABLE MAIN STAGE LABEL
========================================================= */

.stage-brand{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;

  padding:8px 12px;

  border-radius:9px;

  color:#fff;
  background:rgba(0,0,0,.56);

  border:1px solid rgba(255,255,255,.13);

  backdrop-filter:blur(12px);

  font-size:11px;
  font-weight:800;

  cursor:move;

  user-select:none;
  touch-action:none;
}

/* =========================================================
   RECORD STATUS
========================================================= */

.record-status{
  position:absolute;
  top:16px;
  right:16px;
  z-index:25;

  display:none;
  align-items:center;
  gap:8px;

  padding:8px 12px;

  border-radius:999px;

  background:rgba(255,50,70,.12);
  border:1px solid rgba(255,50,70,.25);

  color:#ff7281;

  font-size:10px;
  font-weight:800;
}

.record-status.show{
  display:flex;
}

.record-pulse{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.7);
  }
}

/* =========================================================
   MENTOR CAMERA
========================================================= */

.mentor-pip{
  position:absolute;

  width:220px;
  height:135px;

  right:24px;
  bottom:24px;

  z-index:30;

  display:none;

  overflow:hidden;

  border-radius:15px;

  background:#111721;

  border:1px solid rgba(255,255,255,.16);

  box-shadow:
    0 18px 50px rgba(0,0,0,.55);

  cursor:move;

  user-select:none;
  touch-action:none;
}

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  display:block;
}

.mentor-name{
  position:absolute;
  left:9px;
  bottom:8px;

  padding:5px 8px;

  border-radius:6px;

  background:rgba(0,0,0,.62);

  color:#fff;

  font-size:10px;
  font-weight:700;

  pointer-events:none;
}

/* =========================================================
   TELEPROMPTER / VOICE TEXT
========================================================= */

.teleprompter{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:18px;

  width:min(720px,78%);

  z-index:45;

  display:none;

  background:rgba(5,8,13,.90);

  border:1px solid rgba(255,255,255,.12);

  border-radius:15px;

  backdrop-filter:blur(15px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.4);

  padding:13px;
}

.teleprompter.show{
  display:block;
}

.teleprompter-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:8px;
}

.teleprompter-head strong{
  font-size:10px;
  color:#9eb5ff;
}

.teleprompter-head span{
  color:#697587;
  font-size:9px;
}

#voiceText{
  width:100%;
  min-height:80px;
  max-height:150px;

  resize:vertical;

  border:0;
  outline:none;

  background:transparent;

  color:#f5f7fb;

  font-size:15px;
  line-height:1.65;

  padding:4px;
}

#voiceText::placeholder{
  color:#667286;
}

.teleprompter-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:6px;
}

.small-btn{
  padding:7px 10px;
  border-radius:7px;

  color:#dfe6f2;
  background:rgba(255,255,255,.06);

  border:1px solid var(--border);

  font-size:9px;
  font-weight:700;
}

/*
 IMPORTANT:
 Teleprompter is mentor-only.
 It is NOT part of the Main Video.
 It stays outside the video element.
*/

/* =========================================================
   STUDENTS
========================================================= */

.students-panel{
  min-height:0;

  display:flex;
  flex-direction:column;

  background:rgba(9,13,20,.97);

  border-left:1px solid var(--border);
}

.students-head{
  padding:17px;
  border-bottom:1px solid var(--border);
}

.students-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.students-title strong{
  font-size:13px;
}

.student-count{
  min-width:24px;
  height:24px;

  display:grid;
  place-items:center;

  border-radius:999px;

  background:rgba(91,140,255,.12);

  color:#9bb0ff;

  font-size:10px;
  font-weight:800;
}

.students-list{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:9px;
}

.student{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  border-radius:10px;
}

.avatar{
  width:35px;
  height:35px;

  flex:0 0 35px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #29344b,
      #172033
    );
}

.student-info{
  min-width:0;
}

.student-info strong{
  display:block;

  font-size:11px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.student-info span{
  color:var(--muted);
  font-size:9px;
}

.online-dot{
  margin-left:auto;

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(32,214,139,.7);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
  min-height:103px;

  padding:12px 15px;

  border-top:1px solid var(--border);

  background:rgba(6,9,15,.98);

  z-index:100;
}

.control-row{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

.control-btn{
  min-width:70px;
  height:57px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:5px;

  border-radius:11px;

  color:#dce3ee;

  background:rgba(255,255,255,.045);

  border:1px solid var(--border);

  transition:.18s;
}

.control-btn:hover{
  background:rgba(255,255,255,.08);
  transform:translateY(-1px);
}

.control-btn.active{
  color:#a8bcff;

  background:rgba(91,140,255,.12);

  border-color:rgba(91,140,255,.45);
}

.control-btn.danger{
  color:#ff7180;

  background:rgba(255,70,92,.07);

  border-color:rgba(255,70,92,.25);
}

.control-btn.primary{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      rgba(91,140,255,.24),
      rgba(118,84,255,.18)
    );
}

.control-icon{
  font-size:17px;
}

.control-text{
  font-size:8px;
  font-weight:800;
  white-space:nowrap;
}

.timer{
  min-width:65px;
  height:57px;

  display:grid;
  place-items:center;

  color:#aeb9ca;

  font-size:10px;

  font-variant-numeric:tabular-nums;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-panel{
  position:fixed;

  top:0;
  right:-370px;

  width:min(370px,92vw);
  height:100vh;

  z-index:300;

  padding:22px;

  background:#0b1018;

  border-left:1px solid var(--border);

  box-shadow:
    -20px 0 60px rgba(0,0,0,.45);

  transition:right .25s ease;

  overflow-y:auto;
}

.settings-panel.show{
  right:0;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.modal-head h3{
  font-size:16px;
}

.close-btn{
  width:35px;
  height:35px;

  border-radius:9px;

  color:#dbe3ef;

  background:rgba(255,255,255,.06);
}

.setting{
  margin-bottom:18px;
}

.setting label{
  display:block;

  margin-bottom:7px;

  color:#c6cfdd;

  font-size:10px;
  font-weight:700;
}

.setting input{
  width:100%;
  height:42px;

  border-radius:9px;

  outline:none;

  border:1px solid var(--border);

  background:rgba(255,255,255,.045);

  color:#fff;

  padding:0 11px;
}

.action-btn{
  padding:10px 14px;

  border-radius:8px;

  color:#e9edf5;

  background:rgba(255,255,255,.07);

  border:1px solid var(--border);

  font-size:10px;
  font-weight:700;
}

.action-btn.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}

/* =========================================================
   PREVIEW
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;

  z-index:400;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.76);

  backdrop-filter:blur(10px);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(720px,100%);

  padding:20px;

  border-radius:18px;

  background:#0d121b;

  border:1px solid var(--border);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55);
}

.preview-video{
  width:100%;

  max-height:60vh;

  border-radius:12px;

  background:#000;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:125px;

  z-index:500;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:10px 15px;

  border-radius:9px;

  color:#eef2f8;

  background:rgba(15,20,29,.96);

  border:1px solid var(--border);

  font-size:10px;

  transition:.25s;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .workspace{
    grid-template-columns:1fr;
  }

  .students-panel{
    position:fixed;

    top:64px;
    right:-310px;
    bottom:103px;

    width:300px;

    z-index:200;

    transition:right .25s ease;

    box-shadow:
      -20px 0 50px rgba(0,0,0,.55);
  }

  .students-panel.show{
    right:0;
  }

  .stage-wrap{
    min-height:480px;
  }

  .top-center{
    display:none;
  }

  .mentor-pip{
    width:160px;
    height:100px;
  }

  .teleprompter{
    width:calc(100% - 28px);
    bottom:12px;
  }

  .control-btn{
    min-width:58px;
    height:51px;
  }
}

@media(max-width:540px){

  .brand-info{
    display:none;
  }

  .topbar{
    padding:0 10px;
  }

  .stage-wrap{
    padding:7px;
  }

  .stage{
    border-radius:12px;
  }

  .mentor-pip{
    width:135px;
    height:85px;
  }

  .teleprompter{
    width:calc(100% - 18px);
  }

  #voiceText{
    font-size:14px;
  }

  .control-row{
    gap:4px;
  }

  .control-btn{
    min-width:53px;
  }

  .control-text{
    font-size:7px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

  <div class="brand">

    <div class="brand-logo">
      U
    </div>

    <div class="brand-info">

      <strong>
        UshaLiveAI
      </strong>

      <span>
        Mentor Studio
      </span>

    </div>

  </div>


  <div class="top-center">

    <div
      class="class-name"
      id="className">
      My Live Class
    </div>

    <div class="live-badge">

      <span class="live-dot"></span>

      LIVE STUDIO

    </div>

  </div>


  <div class="top-actions">

    <button
      class="top-btn"
      id="studentsToggle">
      👥
    </button>

    <button
      class="top-btn"
      id="settingsBtn">
      ⚙️
    </button>

    <button
      class="top-btn"
      id="logoutBtn">
      ↪
    </button>

  </div>

</header>


<!-- =======================================================
     WORKSPACE
======================================================= -->

<main class="workspace">


<section class="stage-wrap">

<div
  class="stage"
  id="stage">


<div class="stage-grid"></div>


<!-- =====================================================
     DRAGGABLE BRAND LABEL
===================================================== -->

<div
  class="stage-brand"
  id="stageBrand">

  UshaLiveAI

</div>


<!-- =====================================================
     RECORD STATUS
===================================================== -->

<div
  class="record-status"
  id="recordStatus">

  <span class="record-pulse"></span>

  <span>
    RECORDING
  </span>

  <span id="recordTimer">
    00:00
  </span>

</div>


<!-- =====================================================
     EMPTY STAGE
===================================================== -->

<div
  class="stage-placeholder"
  id="stagePlaceholder">

  <div class="placeholder-content">

    <div class="placeholder-icon">
      🎬
    </div>

    <h2>
      Your Class Stage
    </h2>

    <p>
      Select Main Video, Camera,
      Slide or Share Screen to start.
    </p>

  </div>

</div>


<!-- =====================================================
     MAIN VIDEO
===================================================== -->

<video
  id="mainVideo"
  controls
  playsinline>
</video>


<!-- =====================================================
     SLIDE
===================================================== -->

<img
  id="mainImage"
  alt="Selected slide">


<!-- =====================================================
     SCREEN SHARE
===================================================== -->

<video
  id="screenVideo"
  autoplay
  muted
  playsinline>
</video>


<!-- =====================================================
     MENTOR CAMERA
===================================================== -->

<div
  class="mentor-pip"
  id="mentorPip">

  <video
    id="cameraVideo"
    autoplay
    muted
    playsinline>
  </video>

  <div class="mentor-name">
    Shah Neil Khan
  </div>

</div>


<!-- =====================================================
     TELEPROMPTER
===================================================== -->

<div
  class="teleprompter"
  id="teleprompter">

  <div class="teleprompter-head">

    <strong>
      📝 Mentor Voice Text
    </strong>

    <span>
      Only you can read this
    </span>

  </div>


  <textarea
    id="voiceText"
    placeholder="এখানে আপনার কথা/স্ক্রিপ্ট লিখুন। আপনি দেখে দেখে বলবেন..."></textarea>


  <div class="teleprompter-actions">

    <button
      class="small-btn"
      id="hideVoiceText">
      Hide
    </button>

    <button
      class="small-btn"
      id="clearVoiceText">
      Clear
    </button>

  </div>

</div>


</div>

</section>


<!-- =======================================================
     STUDENTS
======================================================= -->

<aside
  class="students-panel"
  id="studentsPanel">

  <div class="students-head">

    <div class="students-title">

      <strong>
        Students
      </strong>

      <span
        class="student-count"
        id="studentCount">
        0
      </span>

    </div>

  </div>


  <div
    class="students-list"
    id="studentsList">

  </div>

</aside>


</main>


<!-- =======================================================
     CONTROLS
======================================================= -->

<footer class="controls">

<div class="control-row">


<button
  class="control-btn"
  id="slideBtn">

  <span class="control-icon">
    🖼️
  </span>

  <span class="control-text">
    Slide
  </span>

</button>


<button
  class="control-btn"
  id="mainVideoBtn">

  <span class="control-icon">
    🎬
  </span>

  <span class="control-text">
    Main Video
  </span>

</button>


<button
  class="control-btn"
  id="cameraBtn">

  <span class="control-icon">
    📷
  </span>

  <span class="control-text">
    Camera
  </span>

</button>


<button
  class="control-btn"
  id="micBtn">

  <span class="control-icon">
    🎙️
  </span>

  <span class="control-text">
    Mic
  </span>

</button>

<script>

(function(){

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
  document.getElementById(id);


const stage =
  $("stage");

const stagePlaceholder =
  $("stagePlaceholder");

const mainVideo =
  $("mainVideo");

const mainImage =
  $("mainImage");

const screenVideo =
  $("screenVideo");

const cameraVideo =
  $("cameraVideo");

const mentorPip =
  $("mentorPip");

const stageBrand =
  $("stageBrand");

const videoInput =
  $("videoInput");

const slideInput =
  $("slideInput");

const slideBtn =
  $("slideBtn");

const mainVideoBtn =
  $("mainVideoBtn");

const cameraBtn =
  $("cameraBtn");

const micBtn =
  $("micBtn");

const shareBtn =
  $("shareBtn");

const voiceTextBtn =
  $("voiceTextBtn");

const playBtn =
  $("playBtn");

const clearBtn =
  $("clearBtn");

const recordBtn =
  $("recordBtn");

const pauseBtn =
  $("pauseBtn");

const fullscreenBtn =
  $("fullscreenBtn");

const endBtn =
  $("endBtn");

const studentsToggle =
  $("studentsToggle");

const studentsPanel =
  $("studentsPanel");

const settingsBtn =
  $("settingsBtn");

const settingsPanel =
  $("settingsPanel");

const closeSettings =
  $("closeSettings");

const saveSettings =
  $("saveSettings");

const logoutBtn =
  $("logoutBtn");

const className =
  $("className");

const classNameInput =
  $("classNameInput");

const voiceApiInput =
  $("voiceApiInput");

const toast =
  $("toast");

const teleprompter =
  $("teleprompter");

const voiceText =
  $("voiceText");

const hideVoiceText =
  $("hideVoiceText");

const clearVoiceText =
  $("clearVoiceText");

const recordStatus =
  $("recordStatus");

const recordTimer =
  $("recordTimer");

const sessionTimer =
  $("sessionTimer");

const previewModal =
  $("previewModal");

const previewVideo =
  $("previewVideo");

const closePreview =
  $("closePreview");

const closePreview2 =
  $("closePreview2");

const downloadRecording =
  $("downloadRecording");


/* =========================================================
   STATE
========================================================= */

let cameraStream = null;
let micStream = null;
let screenStream = null;

let recorder = null;

let recordedChunks = [];

let recordedBlob = null;
let recordedUrl = null;

let videoObjectUrl = null;
let slideObjectUrl = null;

let isRecording = false;
let isPaused = false;

let recordingSeconds = 0;
let sessionSeconds = 0;

let recordingTimerInterval = null;
let sessionTimerInterval = null;


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    },2500);

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

  const min =
    Math.floor(
      seconds / 60
    )
    .toString()
    .padStart(2,"0");

  const sec =
    Math.floor(
      seconds % 60
    )
    .toString()
    .padStart(2,"0");

  return min + ":" + sec;

}


/* =========================================================
   SESSION TIMER
========================================================= */

sessionTimerInterval =
  setInterval(() => {

    sessionSeconds++;

    sessionTimer.textContent =
      formatTime(
        sessionSeconds
      );

  },1000);


/* =========================================================
   STAGE STATE
========================================================= */

function updateStage(){

  const hasVideo =
    mainVideo.style.display ===
    "block";

  const hasImage =
    mainImage.style.display ===
    "block";

  const hasScreen =
    screenVideo.style.display ===
    "block";

  const hasCamera =
    mentorPip.style.display ===
    "block";

  stagePlaceholder.style.display =
    (
      hasVideo ||
      hasImage ||
      hasScreen ||
      hasCamera
    )
    ? "none"
    : "flex";

}


/* =========================================================
   MAIN VIDEO
========================================================= */

mainVideoBtn.addEventListener(
  "click",
  () => {

    if(isRecording){

      showToast(
        "Stop recording before changing video."
      );

      return;

    }

    videoInput.value =
      "";

    videoInput.click();

  }
);


videoInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];

    if(!file)
      return;


    if(videoObjectUrl){

      URL.revokeObjectURL(
        videoObjectUrl
      );

    }


    videoObjectUrl =
      URL.createObjectURL(
        file
      );


    mainVideo.src =
      videoObjectUrl;


    mainVideo.style.display =
      "block";


    mainImage.style.display =
      "none";


    screenVideo.style.display =
      "none";


    updateStage();


    showToast(
      "Main Video loaded."
    );

  }
);


/* =========================================================
   SLIDE
========================================================= */

slideBtn.addEventListener(
  "click",
  () => {

    if(isRecording){

      showToast(
        "Stop recording before changing slide."
      );

      return;

    }

    slideInput.value =
      "";

    slideInput.click();

  }
);


slideInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0];

    if(!file)
      return;


    if(slideObjectUrl){

      URL.revokeObjectURL(
        slideObjectUrl
      );

    }


    slideObjectUrl =
      URL.createObjectURL(
        file
      );


    mainImage.src =
      slideObjectUrl;


    mainImage.style.display =
      "block";


    mainVideo.style.display =
      "none";


    screenVideo.style.display =
      "none";


    updateStage();


    showToast(
      "Slide loaded."
    );

  }
);


/* =========================================================
   PLAY
========================================================= */

playBtn.addEventListener(
  "click",
  async () => {

    if(
      mainVideo.style.display ===
      "block"
    ){

      try{

        if(
          mainVideo.paused
        ){

          await mainVideo.play();

          playBtn.classList.add(
            "active"
          );

        }else{

          mainVideo.pause();

          playBtn.classList.remove(
            "active"
          );

        }

      }catch(error){

        showToast(
          "Video play failed."
        );

      }

      return;

    }

    showToast(
      "Select Main Video first."
    );

  }
);


/* =========================================================
   CAMERA
========================================================= */

cameraBtn.addEventListener(
  "click",
  async () => {

    if(cameraStream){

      stopCamera();

      return;

    }


    try{

      cameraStream =
        await navigator.mediaDevices
        .getUserMedia({
          video:true,
          audio:false
        });


      cameraVideo.srcObject =
        cameraStream;


      mentorPip.style.display =
        "block";


      cameraBtn.classList.add(
        "active"
      );


      updateStage();


      showToast(
        "Camera ON."
      );

    }catch(error){

      console.error(error);

      showToast(
        "Camera permission denied."
      );

    }

  }
);


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  cameraStream =
    null;

  cameraVideo.srcObject =
    null;

  mentorPip.style.display =
    "none";

  cameraBtn.classList.remove(
    "active"
  );

  updateStage();

  showToast(
    "Camera OFF."
  );

}


/* =========================================================
   MICROPHONE
========================================================= */

micBtn.addEventListener(
  "click",
  async () => {

    if(micStream){

      stopMic();

      return;

    }


    try{

      micStream =
        await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


      micBtn.classList.add(
        "active"
      );


      showToast(
        "Microphone ON."
      );

    }catch(error){

      console.error(error);

      showToast(
        "Microphone permission denied."
      );

    }

  }
);


function stopMic(){

  if(micStream){

    micStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  micStream =
    null;

  micBtn.classList.remove(
    "active"
  );

  showToast(
    "Microphone OFF."
  );

}


/* =========================================================
   SCREEN SHARE
========================================================= */

shareBtn.addEventListener(
  "click",
  async () => {

    if(screenStream){

      stopScreen();

      return;

    }


    try{

      screenStream =
        await navigator.mediaDevices
        .getDisplayMedia({
          video:true,
          audio:true
        });


      screenVideo.srcObject =
        screenStream;


      screenVideo.style.display =
        "block";


      mainVideo.style.display =
        "none";


      mainImage.style.display =
        "none";


      screenVideo.play()
        .catch(
          () => {}
        );


      shareBtn.classList.add(
        "active"
      );


      updateStage();


      const track =
        screenStream
        .getVideoTracks()[0];


      if(track){

        track.addEventListener(
          "ended",
          stopScreen
        );

      }


      showToast(
        "Screen sharing started."
      );

    }catch(error){

      console.error(error);

      showToast(
        "Screen sharing cancelled."
      );

    }

  }
);


function stopScreen(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track =>
          track.stop()

  screenVideo.style.display =

  shareBtn.classList.remove(

/* =========================================================
   VOICE TEXT / TELEPROMPTER
========================================================= */

voiceTextBtn.addEventListener(

      teleprompter.classList.contains(

*/


/* =========================================================
   CLEAR
========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    if(isRecording){

      showToast(
        "Stop recording first."
      );

      return;

    }


    mainVideo.pause();

    mainVideo.removeAttribute(

    mainVideo.load();

    mainVideo.style.display =

    mainImage.style.display =

      stopScreen();

    }


    updateStage();


    showToast(
      "Stage cleared."

/* =========================================================
   RECORD
========================================================= */

recordBtn.addEventListener(
  "click",
  () => {

    if(isRecording){

      stopRecording();

    }else{

      startRecording();

    }

  }
);


async function startRecording(){

  try{

    const displayStream =
      await navigator.mediaDevices
      .getDisplayMedia({
        video:true,
        audio:true
      });


    let tracks = [
      ...displayStream.getVideoTracks(),
      ...displayStream.getAudioTracks()
    ];


    if(micStream){

      tracks.push(
        ...micStream.getAudioTracks()
      );

    }


    const recordingStream =
      new MediaStream(
        tracks
      );


    let mimeType =
      "video/webm";


    if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9,opus"
      )
    ){

      mimeType =
        "video/webm;codecs=vp9,opus";

    }


    recorder =
      new MediaRecorder(
        recordingStream,
        {mimeType}
      );


    recordedChunks =
      [];


    recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          recordedChunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      () => {

        recordedBlob =
          new Blob(
            recordedChunks,
            {
              type:mimeType
            }
          );


        if(recordedUrl){

          URL.revokeObjectURL(
            recordedUrl
          );

        }


        recordedUrl =
          URL.createObjectURL(
            recordedBlob
          );


        previewVideo.src =
          recordedUrl;


        previewModal.classList.add(
          "show"
        );


        displayStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        showToast(
          "Recording ready."
        );

      };


    recorder.start(1000);


    isRecording =
      true;

    isPaused =
      false;


    recordingSeconds =
      0;


    recordTimer.textContent =
      "00:00";


    recordStatus.classList.add(
      "show"
    );


    recordBtn.classList.add(
      "active"
    );


    recordBtn.querySelector(
      ".control-text"
    ).textContent =
      "Stop";


    recordingTimerInterval =
      setInterval(
        () => {

          if(!isPaused){

            recordingSeconds++;

            recordTimer.textContent =
              formatTime(
                recordingSeconds
              );

          }

        },
        1000
      );


    showToast(
      "Recording started."
    );


  }catch(error){

    console.error(error);

    showToast(
      "Recording cancelled."
    );

  }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording(){

  if(
    !recorder ||
    recorder.state ===
    "inactive"
  ){

    return;

  }


  recorder.stop();


  isRecording =
    false;

  isPaused =
    false;


  clearInterval(
    recordingTimerInterval
  );


  recordingTimerInterval =
    null;


  recordStatus.classList.remove(
    "show"
  );


  recordBtn.classList.remove(
    "active"
  );


  recordBtn.querySelector(
    ".control-text"
  ).textContent =
    "Record";


  pauseBtn.querySelector(
    ".control-text"
  ).textContent =
    "Pause";


}


/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener(
  "click",
  () => {

    if(
      !recorder ||
      recorder.state ===
      "inactive"
    ){

      showToast(
        "Start recording first."
      );

      return;

    }


    if(!isPaused){

      if(
        recorder.state ===
        "recording"
      ){

        recorder.pause();

        isPaused =
          true;

        pauseBtn.classList.add(
          "active"
        );

        pauseBtn.querySelector(
          ".control-text"
        ).textContent =
          "Resume";

      }

    }else{

      if(
        recorder.state ===
        "paused"
      ){

        recorder.resume();

        isPaused =
          false;

        pauseBtn.classList.remove(
          "active"
        );

        pauseBtn.querySelector(
          ".control-text"
        ).textContent =
          "Pause";

      }

    }

  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

  "click",

   STUDENTS

studentsToggle.addEventListener(

========================================================= */

    );

closeSettings.addEventListener(

  }
);


saveSettings.addEventListener(

  () => {

    const name =
      classNameInput.value.trim() ||

      "ushaLiveClassName",

    className.textContent =
      name;


    settingsPanel.classList.remove(

      "Settings saved."
    );

);


className.textContent =
  localStorage.getItem(
    "ushaLiveClassName"

/* =========================================================
   PREVIEW
========================================================= */

function closePreviewModal(){

  previewModal.classList.remove(
    "show"
  );

  previewVideo.pause();

}


closePreview.addEventListener(
  "click",
  closePreviewModal
);


closePreview2.addEventListener(
  "click",
  closePreviewModal
);


/* =========================================================
   DOWNLOAD
========================================================= */

downloadRecording.addEventListener(
  "click",
  () => {

    if(!recordedUrl){

      showToast(
        "No recording available."
      );

      return;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      recordedUrl;


    link.download =
      "UshaLiveAI-Class-" +
      Date.now() +
      ".webm";


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    showToast(

    );

);


/* =========================================================
   END STUDIO
========================================================= */

endBtn.addEventListener(
  "click",
  () => {

    if(isRecording){

      const ok =
        confirm(
          "Recording চলছে। Studio বন্ধ করবেন?"
        );

      if(!ok)
        return;

      stopRecording();

    }


    stopCamera();
    stopMic();
    stopScreen();


    window.location.href =
      "../dashboard/";

  }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    if(isRecording){

      const ok =
        confirm(
          "Recording চলছে। Logout করবেন?"
        );

      if(!ok)
        return;

      stopRecording();

    }


    try{

      const firebase =
        await import(
          "../firebase.js"
        );


      const authModule =
        await import(
          "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
        );


      await authModule.signOut(
        firebase.auth
      );

    }catch(error){

      console.warn(
        error
      );

    }


    window.location.href =
      "../login/";

  }
);


/* =========================================================
   DRAG SYSTEM
   Mouse + Touch
========================================================= */

function makeDraggable(
  element,
  container
){

  let dragging =
    false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  function pointerDown(event){

    dragging =
      true;


    element.setPointerCapture?.(
      event.pointerId
    );


    const rect =
      element.getBoundingClientRect();


    const parentRect =
      container.getBoundingClientRect();


    startX =
      event.clientX;

    startY =
      event.clientY;


    startLeft =
      rect.left -
      parentRect.left;


    startTop =
      rect.top -
      parentRect.top;


    element.style.right =
      "auto";

    element.style.bottom =
      "auto";

  }


  function pointerMove(event){

    if(!dragging)
      return;


    const parentRect =
      container.getBoundingClientRect();


    let newLeft =
      startLeft +
      (
        event.clientX -
        startX
      );


    let newTop =
      startTop +
      (
        event.clientY -
        startY
      );


    const maxLeft =
      parentRect.width -
      element.offsetWidth;


    const maxTop =
      parentRect.height -
      element.offsetHeight;


    newLeft =
      Math.max(
        0,
        Math.min(
          newLeft,
          maxLeft
        )
      );


    newTop =
      Math.max(
        0,
        Math.min(
          newTop,
          maxTop
        )
      );


    element.style.left =
      newLeft + "px";


    element.style.top =
      newTop + "px";

  }


  function pointerUp(){

    dragging =
      false;

  }


  element.addEventListener(
    "pointerdown",
    pointerDown
  );


  element.addEventListener(
    "pointermove",
    pointerMove
  );


  element.addEventListener(
    "pointerup",
    pointerUp
  );


  element.addEventListener(
    "pointercancel",
    pointerUp
  );

}


/* =========================================================
   ENABLE DRAG
========================================================= */

makeDraggable(
  mentorPip,
  stage
);


makeDraggable(
  stageBrand,
  stage
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const tag =
      event.target?.tagName;


    if(
      tag === "INPUT" ||
      tag === "TEXTAREA"
    ){

      return;

    }


    if(
      event.key.toLowerCase() ===
      "r"
    ){

      recordBtn.click();

    }


    if(
      event.key.toLowerCase() ===
      "m"
    ){

      micBtn.click();

    }


    if(
      event.key.toLowerCase() ===
      "c"
    ){

      cameraBtn.click();

    }


    if(
      event.key.toLowerCase() ===
      "s"
    ){

      shareBtn.click();

    }


    if(
      event.key.toLowerCase() ===
      "f"
    ){

      fullscreenBtn.click();

    }


    if(
      event.code ===
      "Space"
    ){

      event.preventDefault();

      pauseBtn.click();

    }

  }
);
