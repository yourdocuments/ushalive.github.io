<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UshaLiveAI — Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #05070d;
      --card: rgba(15, 20, 32, 0.88);
      --border: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
      --muted: #9ba4b5;
      --accent: #7c5cff;
      --accent2: #00d4ff;
      --danger: #ff5d73;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(124, 92, 255, 0.20),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(0, 212, 255, 0.13),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 16px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      box-shadow:
        0 20px 60px rgba(124, 92, 255, 0.28);
    }

    .brand h1 {
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .brand p {
      color: var(--muted);
      margin-top: 7px;
      font-size: 14px;
    }

    .login-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 26px;

      padding: 30px;

      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(20px);
    }

    .login-card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;

      height: 52px;

      border-radius: 14px;

      border: 1px solid var(--border);

      outline: none;

      background: rgba(255, 255, 255, 0.045);

      color: white;

      padding: 0 15px;

      font-size: 15px;

      transition: 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 4px rgba(124, 92, 255, 0.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 58px;
    }

    .show-password {
      position: absolute;

      right: 8px;
      top: 8px;

      width: 36px;
      height: 36px;

      border: none;

      border-radius: 10px;

      background: rgba(255, 255, 255, 0.06);

      color: #b9c1d0;

      cursor: pointer;
    }

    .show-password:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .login-btn {
      width: 100%;

      height: 54px;

      border: none;

      border-radius: 15px;

      cursor: pointer;

      color: white;

      font-size: 15px;

      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #6250e8
        );

      box-shadow:
        0 12px 30px rgba(124, 92, 255, 0.25);

      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 16px 35px rgba(124, 92, 255, 0.34);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 17px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      color: #ffb5bf;

      background: rgba(255, 93, 115, 0.09);

      border: 1px solid rgba(255, 93, 115, 0.18);
    }

    .message.success {
      display: block;

      color: #a9f5d1;

      background: rgba(0, 210, 130, 0.09);

      border: 1px solid rgba(0, 210, 130, 0.18);
    }

    .back-home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: var(--muted);

      text-decoration: none;

      font-size: 13px;
    }

    .back-home:hover {
      color: white;
    }

    .security-note {
      margin-top: 22px;

      text-align: center;

      color: #6f7888;

      font-size: 11px;
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding: 23px 19px;
        border-radius: 22px;
      }

      .brand h1 {
        font-size: 26px;
      }

    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <section class="brand">

      <div class="logo">
        U
      </div>

      <h1>UshaLiveAI</h1>

      <p>AI-powered learning & mentor platform</p>

    </section>


    <section class="login-card">

      <h2>Welcome back</h2>

      <p class="subtitle">
        Sign in to continue to your UshaLiveAI account.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Sign In
        </button>

      </form>


      <div
        id="message"
        class="message"
        aria-live="polite"
      ></div>


      <a
        href="../"
        class="back-home"
      >
        ← Back to Home
      </a>


      <div class="security-note">
        🔒 Secure login powered by Firebase
      </div>

    </section>

  </main>


  <script type="module">

    import {
      auth
    } from "../firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    showPassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        showPassword.textContent =
          isPassword
            ? "🙈"
            : "👁";

      }
    );


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password."
          );

          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Signing in...";

        message.className =
          "message";


        try {

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          console.log(
            "UshaLiveAI user:",
            user.email
          );


          /*
           * Temporary destination.
           * We will create the dashboard
           * in the next step.
           */

          setTimeout(() => {

            window.location.href =
              "../";

          }, 700);


        } catch (error) {

          console.error(
            "UshaLiveAI Login Error:",
            error
          );


          let errorMessage =
            "Login failed. Please check your email and password.";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Email or password is incorrect.";

          }
          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            errorMessage =
              "No account found with this email.";

          }
          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            errorMessage =
              "Incorrect password.";

          }
          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            errorMessage =
              "Too many attempts. Please try again later.";

          }
          else if (
            error.code ===
            "auth/api-key-not-valid"
          ) {

            errorMessage =
              "Firebase API configuration is invalid.";

          }


          showMessage(errorMessage);


          loginBtn.disabled = false;

          loginBtn.textContent =
            "Sign In";

        }

      }
    );

  </script>

</body>
</html>
